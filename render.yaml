services:
  - type: web
    name: mjm
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node dist-server/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: enables auto-translation on create/update
      # - key: GEMINI_API_KEY
      #   sync: false
      # Required: set these in the Render dashboard as secret values.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # Persistent DB location (requires a Render disk mounted at /var/data)
      - key: DB_PATH
        value: /var/data/menu.db
      - key: MEDIA_DIR
        value: /var/data/media
    disk:
      name: menu-data
      mountPath: /var/data
      sizeGB: 1

