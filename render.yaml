services:
  - type: web
    name: menu-od-miki
    env: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Optional: enables auto-translation on create/update
      # - key: GEMINI_API_KEY
      #   sync: false
      # Persistent DB location (requires a Render disk mounted at /var/data)
      - key: DB_PATH
        value: /var/data/menu.db
    disk:
      name: menu-data
      mountPath: /var/data
      sizeGB: 1

